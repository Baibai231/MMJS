  <text x="1044" y="496" text-anchor="middle" class="heading">候选动作</text>
  <text x="1044" y="553" text-anchor="middle" class="body">账户群体 × 规则 × 规模</text>
  <text x="1044" y="595" text-anchor="middle" class="small">热点组 · 结构组 · 18 条方法</text>

  <path d="M1217 542 H1264" class="line"/>
  <rect x="1272" y="458" width="455" height="171" class="box"/>
  <rect x="1272" y="458" width="455" height="55" fill="#dff1e8" stroke="#59616d" stroke-width="2.3"/>
  <text x="1296" y="495" class="step">04</text>
  <text x="1500" y="496" text-anchor="middle" class="heading">模拟与选择</text>
  <text x="1500" y="553" text-anchor="middle" class="body">预测迁移后的完整频次</text>
  <text x="1500" y="595" text-anchor="middle" class="small">按预计拟合 W1 收益排序</text>

  <path d="M1500 629 V672" class="line"/>
  <rect x="1174" y="681" width="553" height="187" class="box"/>
  <rect x="1174" y="681" width="553" height="55" fill="#f7e7e7" stroke="#59616d" stroke-width="2.3"/>
