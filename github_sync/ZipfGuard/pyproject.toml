[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zipfguard"
version = "0.1.0"
description = "Offline DP-HTPG password policy risk laboratory"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
web = ["streamlit>=1.35"]

[tool.setuptools]
packages = ["core", "ai", "policy", "experiments", "web"]
