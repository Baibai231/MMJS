  <text x="68" y="380" class="section">预算约束下的逐轮局部干预</text>
  <path d="M68 394 H1730" stroke="#8c94a5" stroke-width="2"/>
  <path d="M1725 151 H1745 V416 H275 V449" class="line"/>

  <rect x="72" y="458" width="345" height="171" class="box"/>
