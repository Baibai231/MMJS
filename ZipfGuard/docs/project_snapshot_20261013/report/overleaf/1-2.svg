  <text x="237" y="211" text-anchor="middle" class="body">按出现记录抽样</text>
  <text x="237" y="261" text-anchor="middle" class="small">固定随机种子 · 数据摘要</text>

  <path d="M402 180 H473 V171 H501" class="line"/>
  <path d="M473 180 V260 H501" class="line"/>

