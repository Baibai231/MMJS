  <path d="M975 264 H1022" class="line"/>

  <rect x="1030" y="105" width="695" height="92" class="box"/>
  <rect x="1030" y="105" width="695" height="92" fill="#f3f8ee" stroke="#59616d" stroke-width="2.3"/>
  <text x="1377" y="145" text-anchor="middle" class="heading">8 字符基础迁移</text>
