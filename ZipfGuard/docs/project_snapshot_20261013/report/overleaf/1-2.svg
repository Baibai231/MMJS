  <text x="495" y="495" class="step">02</text>
  <text x="644" y="496" text-anchor="middle" class="heading">分布分析</text>
  <text x="644" y="553" text-anchor="middle" class="body">经验 W1 距离初筛</text>
  <text x="644" y="595" text-anchor="middle" class="small">CDF 采样拟合与复核</text>

  <path d="M817 542 H864" class="line"/>
  <rect x="872" y="458" width="345" height="171" class="box"/>
  <rect x="872" y="458" width="345" height="55" fill="#dff1e8" stroke="#59616d" stroke-width="2.3"/>
