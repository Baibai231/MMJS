<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1190" viewBox="0 0 1800 1190">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #232731; }
      .section { font-size: 37px; font-weight: 700; }
      .heading { font-size: 34px; font-weight: 700; }
      .body { font-size: 27px; }
      .small { font-size: 24px; }
      .step { font-size: 23px; font-weight: 700; fill: #59627a; }
      .line { stroke: #4d5667; stroke-width: 3.5; fill: none; marker-end: url(#arrow); }
      .feedback { stroke: #347e68; stroke-width: 3.5; fill: none; marker-end: url(#green-arrow); }
      .model { stroke: #796a9d; stroke-width: 3; stroke-dasharray: 11 8; fill: none; marker-end: url(#purple-arrow); }
      .box { fill: #fff; stroke: #59616d; stroke-width: 2.3; rx: 5; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#4d5667" stroke-width="2"/></marker>
    <marker id="green-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#347e68" stroke-width="2"/></marker>
    <marker id="purple-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#796a9d" stroke-width="2"/></marker>
  </defs>

  <rect width="1800" height="1190" fill="#fff"/>

  <!-- 数据准备：目标群体与独立开发记录按出现位置划分。 -->
