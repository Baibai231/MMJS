  <path d="M892 868 V920" class="line"/>
  <text x="68" y="970" class="section">对照实验、终态评估与输出</text>
  <path d="M68 984 H1730" stroke="#8c94a5" stroke-width="2"/>

  <rect x="72" y="1014" width="505" height="133" class="box"/>
  <rect x="72" y="1014" width="505" height="48" fill="#e9e5f7" stroke="#59616d" stroke-width="2.3"/>
