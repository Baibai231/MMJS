<rect x="70" y="40.0" width="64" height="120.0" fill="#0b7a4b"/><text x="70" y="310" font-family="sans-serif" font-size="12">modern</text><rect x="190" y="160.0" width="64" height="21.8" fill="#9b2c2c"/><text x="190" y="310" font-family="sans-serif" font-size="12">paper</text><rect x="310" y="160.0" width="64" height="21.8" fill="#9b2c2c"/><text x="310" y="310" font-family="sans-serif" font-size="12">budget</text><rect x="430" y="160.0" width="64" height="0.0" fill="#0b7a4b"/><text x="430" y="310" font-family="sans-serif" font-size="12">per-pw</text>
