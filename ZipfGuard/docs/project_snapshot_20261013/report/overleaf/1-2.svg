  <text x="1450" y="814" text-anchor="middle" class="small">PCFG 与 OMEN 各前 100 万次</text>
  <text x="1450" y="846" text-anchor="middle" class="small">未通过则重试；整批无法合规则不下发</text>
  <path d="M1377 310 V344 H1760 V774 H1736" class="model"/>

  <path d="M1174 774 H1127" class="line"/>
  <rect x="666" y="681" width="453" height="187" class="box"/>
  <rect x="666" y="681" width="453" height="55" fill="#dff1e8" stroke="#59616d" stroke-width="2.3"/>
  <text x="690" y="719" class="step">06</text>
  <text x="892" y="719" text-anchor="middle" class="heading">执行与反馈</text>
  <text x="892" y="775" text-anchor="middle" class="body">提交整批修改，登记通知成本</text>
  <text x="892" y="814" text-anchor="middle" class="small">更新账户状态 · 频次 · 剩余预算</text>
  <text x="892" y="846" text-anchor="middle" class="small">预算耗尽或无正收益候选时停止</text>

  <path d="M666 785 H244 V640" class="feedback"/>
  <rect x="293" y="756" width="317" height="42" fill="#fff"/>
  <text x="451" y="786" text-anchor="middle" class="small" fill="#347e68">下一轮重新分析分布</text>

