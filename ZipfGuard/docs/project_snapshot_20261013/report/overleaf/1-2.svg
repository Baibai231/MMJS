  <text x="568" y="162" text-anchor="middle" class="step">目标</text>
  <text x="649" y="161" class="body">固定规模存量账户群体</text>

  <rect x="510" y="218" width="465" height="92" class="box"/>
  <rect x="510" y="218" width="115" height="92" fill="#e9e5f7" stroke="#59616d" stroke-width="2.3"/>
